<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background: #218838; }
        .filters { margin-bottom: 20px; display: flex; gap: 10px; }
        .resumo-cards { display: flex; gap: 10px; margin-bottom: 20px; }
        .card { padding: 15px; border-radius: 8px; color: white; flex: 1; text-align: center; font-weight: bold; }
        .card.receita { background-color: #28a745; }
        .card.despesa { background-color: #dc3545; }
        .card.saldo { background-color: #007bff; }
    </style>
</head>
<body>

    <h1>Controle Financeiro</h1>

    <div class="container">
        <!-- Formulário de Lançamento -->
        <div class="box">
            <h2>Novo Lançamento</h2>
            <form id="formLancamento">
                <input type="date" id="data" required>
                <input type="text" id="descricao" placeholder="Descrição (Ex: Conta de Luz)" required>
                <select id="tipo" required onchange="toggleValorInput()">
                    <option value="">Selecione o Tipo</option>
                    <option value="Receita">Receita</option>
                    <option value="Despesa">Despesa</option>
                </select>
                <input type="text" id="categoria" placeholder="Categoria (Ex: Moradia, Salário)" required>
                <input type="number" id="valor" placeholder="Valor (R$)" step="0.01" required>
                <button type="submit">Salvar no Google Sheets</button>
                <p id="statusMsg"></p>
            </form>
        </div>

        <!-- Dashboard -->
        <div class="box" style="flex: 2;">
            <h2>Dashboard</h2>
            
            <!-- Filtro -->
            <div class="filters">
                <select id="filtroMes" onchange="atualizarDashboard()">
                    <option value="Todos">Todos os Meses</option>
                    <option value="JAN">Janeiro</option>
                    <option value="FEV">Fevereiro</option>
                    <option value="MAR">Março</option>
                    <option value="ABR">Abril</option>
                    <option value="MAI">Maio</option>
                </select>
            </div>

            <!-- Cards de Resumo -->
            <div class="resumo-cards">
                <div class="card receita">Receitas: R$ <span id="totReceita">0.00</span></div>
                <div class="card despesa">Despesas: R$ <span id="totDespesa">0.00</span></div>
                <div class="card saldo">Saldo: R$ <span id="totSaldo">0.00</span></div>
            </div>

            <!-- Gráfico -->
            <canvas id="meuGrafico"></canvas>
        </div>
    </div>

    <script>
        // COLOQUE SUA URL AQUI
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwIG_9YTGxnfmozj1UMh8lguo2t7HJj8cYeEOgaVAim0BOv_oOUWByciFGvwafAMQIE/exec'; 
        
        let dadosPlanilha = [];
        let grafico;

        // Função para salvar dados
        document.getElementById('formLancamento').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.innerText = "Salvando...";
            
            const dataInp = document.getElementById('data').value;
            const mes = new Date(dataInp).toLocaleString('pt-BR', { month: 'short' }).toUpperCase().replace(".", "");
            const tipo = document.getElementById('tipo').value;
            const valor = parseFloat(document.getElementById('valor').value);

            const payload = {
                data: dataInp,
                mes: mes,
                descricao: document.getElementById('descricao').value,
                tipo: tipo,
                categoria: document.getElementById('categoria').value,
                receita: tipo === 'Receita' ? valor : 0,
                despesa: tipo === 'Despesa' ? valor : 0
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Evita erro de CORS ao enviar
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                document.getElementById('statusMsg').innerText = "Salvo com sucesso!";
                document.getElementById('formLancamento').reset();
                carregarDados(); // Atualiza dashboard
            } catch (err) {
                document.getElementById('statusMsg').innerText = "Erro ao salvar.";
            } finally {
                btn.innerText = "Salvar no Google Sheets";
                setTimeout(() => document.getElementById('statusMsg').innerText = "", 3000);
            }
        });

        // Carregar dados da planilha
        async function carregarDados() {
            try {
                const resposta = await fetch(SCRIPT_URL);
                dadosPlanilha = await resposta.json();
                atualizarDashboard();
            } catch (err) {
                console.error("Erro ao carregar dados:", err);
            }
        }

        // Atualizar os gráficos e totalizadores baseado nos filtros
        function atualizarDashboard() {
            const filtroMes = document.getElementById('filtroMes').value;
            
            let dadosFiltrados = dadosPlanilha;
            if (filtroMes !== "Todos") {
                dadosFiltrados = dadosPlanilha.filter(item => {
                    // Trata as diferenças de string/abreviação
                    return String(item['Mês']).toUpperCase().includes(filtroMes.substring(0,3));
                });
            }

            // Calcular totais
            let totReceitas = 0;
            let totDespesas = 0;
            
            // Agrupar por categoria para o gráfico
            let despesasPorCategoria = {};

            dadosFiltrados.forEach(item => {
                let rec = parseFloat(item['Receita']) || 0;
                let des = parseFloat(item['Despesa']) || 0;
                totReceitas += rec;
                totDespesas += des;

                if (des > 0) {
                    let cat = item['Categoria'] || 'Sem Categoria';
                    despesasPorCategoria[cat] = (despesasPorCategoria[cat] || 0) + des;
                }
            });

            // Atualizar Cards
            document.getElementById('totReceita').innerText = totReceitas.toFixed(2);
            document.getElementById('totDespesa').innerText = totDespesas.toFixed(2);
            document.getElementById('totSaldo').innerText = (totReceitas - totDespesas).toFixed(2);

            // Atualizar Gráfico (Despesas por Categoria)
            const ctx = document.getElementById('meuGrafico').getContext('2d');
            
            if (grafico) grafico.destroy(); // Apaga o gráfico antigo antes de desenhar o novo

            grafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(despesasPorCategoria),
                    datasets: [{
                        label: 'Despesas por Categoria',
                        data: Object.values(despesasPorCategoria),
                        backgroundColor: '#dc3545'
                    }]
                },
                options: { responsive: true }
            });
        }

        // Carrega os dados assim que a página abre
        window.onload = carregarDados;
    </script>
</body>
</html>
