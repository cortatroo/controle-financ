<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f7f6; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .box { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        form { display: flex; flex-direction: column; gap: 10px; }
        input, select, button { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; cursor: pointer; border: none; font-weight: bold; }
        button:hover { background: #218838; }
        .filters { margin-bottom: 20px; display: flex; gap: 10px; }
        .resumo-cards { display: flex; gap: 10px; margin-bottom: 20px; }
        .card { padding: 15px; border-radius: 8px; color: white; flex: 1; text-align: center; font-weight: bold; }
        .card.receita { background-color: #28a745; }
        .card.despesa { background-color: #dc3545; }
        .card.saldo { background-color: #007bff; }
    </style>
</head>
<body>

    <h1>Controle Financeiro</h1>

    <div class="container">
        <!-- Formulário de Lançamento -->
        <div class="box">
            <h2>Novo Lançamento</h2>
            <form id="formLancamento">
                <input type="date" id="data" required>
                <input type="text" id="descricao" placeholder="Descrição (Ex: Conta de Luz)" required>
                
                <select id="tipo" required>
                    <option value="">Selecione o Tipo</option>
                    <option value="Receita">Receita</option>
                    <option value="Despesa">Despesa</option>
                </select>
                
                <!-- Aqui mudou para Select -->
                <select id="categoria" required>
                    <option value="">Carregando categorias...</option>
                </select>
                
                <input type="number" id="valor" placeholder="Valor (R$)" step="0.01" required>
                <button type="submit">Salvar no Google Sheets</button>
                <p id="statusMsg" style="font-weight: bold; text-align: center;"></p>
            </form>
        </div>

        <!-- Dashboard -->
        <div class="box" style="flex: 2;">
            <h2>Dashboard</h2>
            
            <div class="filters">
                <select id="filtroMes" onchange="atualizarDashboard()">
                    <option value="Todos">Todos os Meses</option>
                    <option value="JAN">Janeiro</option>
                    <option value="FEV">Fevereiro</option>
                    <option value="MAR">Março</option>
                    <option value="ABR">Abril</option>
                    <option value="MAI">Maio</option>
                    <option value="JUN">Junho</option>
                    <option value="JUL">Julho</option>
                    <option value="AGO">Agosto</option>
                    <option value="SET">Setembro</option>
                    <option value="OUT">Outubro</option>
                    <option value="NOV">Novembro</option>
                    <option value="DEZ">Dezembro</option>
                </select>
            </div>

            <div class="resumo-cards">
                <div class="card receita">Receitas: R$ <span id="totReceita">0.00</span></div>
                <div class="card despesa">Despesas: R$ <span id="totDespesa">0.00</span></div>
                <div class="card saldo">Saldo: R$ <span id="totSaldo">0.00</span></div>
            </div>

            <canvas id="meuGrafico"></canvas>
        </div>
    </div>

    <script>
        // ===> COLE SUA NOVA URL DO APPS SCRIPT AQUI <===
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbytzL7ytbgST-bQ_anoneME9r-uo2z8X6lmSNR8A1abuqpzdLbOJ8s3kRn6vzHdUhcF/exec'; 
        
        let dadosPlanilha = [];
        let grafico;

        // Salvar novos dados
        document.getElementById('formLancamento').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const statusMsg = document.getElementById('statusMsg');
            
            btn.innerText = "Salvando...";
            statusMsg.innerText = "";
            statusMsg.style.color = "black";
            
            const dataInp = document.getElementById('data').value;
            // Padroniza o mês para bater com o filtro (ex: JAN, FEV)
            const [ano, mesNum, dia] = dataInp.split('-');
            const mesesNomes = ["", "JAN", "FEV", "MAR", "ABR", "MAI", "JUN", "JUL", "AGO", "SET", "OUT", "NOV", "DEZ"];
            const mes = mesesNomes[parseInt(mesNum, 10)];
            const tipo = document.getElementById('tipo').value;
            const valor = parseFloat(document.getElementById('valor').value);

            const payload = {
                data: dataInp,
                mes: mes,
                descricao: document.getElementById('descricao').value,
                tipo: tipo,
                categoria: document.getElementById('categoria').value,
                receita: tipo === 'Receita' ? valor : 0,
                despesa: tipo === 'Despesa' ? valor : 0
            };

            try {
                // Modificado para texto simples, evita erro de bloqueio de CORS no envio para o Google
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8',
                    },
                    body: JSON.stringify(payload)
                });
                
                statusMsg.innerText = "✅ Salvo com sucesso!";
                statusMsg.style.color = "green";
                document.getElementById('formLancamento').reset();
                carregarDados(); // Atualiza painel com o dado novo
            } catch (err) {
                console.error(err);
                statusMsg.innerText = "❌ Erro ao salvar. Tente novamente.";
                statusMsg.style.color = "red";
            } finally {
                btn.innerText = "Salvar no Google Sheets";
                setTimeout(() => statusMsg.innerText = "", 4000);
            }
        });

        // Carregar dados e categorias
        async function carregarDados() {
            try {
                const resposta = await fetch(SCRIPT_URL);
                const json = await resposta.json();
                
                // 1. Salva os lançamentos
                dadosPlanilha = json.lancamentos;
                
                // 2. Preenche o select de categorias
                const selectCategoria = document.getElementById('categoria');
                selectCategoria.innerHTML = '<option value="">Selecione a Categoria</option>';
                
                json.categorias.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.innerText = cat;
                    selectCategoria.appendChild(option);
                });

                // 3. Atualiza os gráficos
                atualizarDashboard();
            } catch (err) {
                console.error("Erro ao carregar dados:", err);
                document.getElementById('categoria').innerHTML = '<option value="">Erro ao carregar</option>';
            }
        }

        // Dashboard
        function atualizarDashboard() {
            const filtroMes = document.getElementById('filtroMes').value;
            
            let dadosFiltrados = dadosPlanilha;
            if (filtroMes !== "Todos") {
                dadosFiltrados = dadosPlanilha.filter(item => {
                    return String(item['Mês']).toUpperCase().includes(filtroMes.substring(0,3));
                });
            }

            let totReceitas = 0;
            let totDespesas = 0;
            let despesasPorCategoria = {};

            dadosFiltrados.forEach(item => {
                let rec = parseFloat(item['Receita']) || 0;
                let des = parseFloat(item['Despesa']) || 0;
                totReceitas += rec;
                totDespesas += des;

                if (des > 0) {
                    let cat = item['Categoria'] || 'Sem Categoria';
                    despesasPorCategoria[cat] = (despesasPorCategoria[cat] || 0) + des;
                }
            });

            // Atualiza Texto
            document.getElementById('totReceita').innerText = totReceitas.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            document.getElementById('totDespesa').innerText = totDespesas.toLocaleString('pt-BR', { minimumFractionDigits: 2 });
            document.getElementById('totSaldo').innerText = (totReceitas - totDespesas).toLocaleString('pt-BR', { minimumFractionDigits: 2 });

            // Atualiza Gráfico
            const ctx = document.getElementById('meuGrafico').getContext('2d');
            if (grafico) grafico.destroy(); 

            grafico = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: Object.keys(despesasPorCategoria),
                    datasets: [{
                        label: 'Despesas por Categoria (R$)',
                        data: Object.values(despesasPorCategoria),
                        backgroundColor: '#dc3545'
                    }]
                },
                options: { responsive: true }
            });
        }

        // Inicia
        window.onload = carregarDados;
    </script>
</body>
</html>
